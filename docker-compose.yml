services:
  db:
    image: pgvector/pgvector:pg16
    container_name: repomind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
      POSTGRES_DB: repomind
    ports:
      - "5432:5432"
    volumes:
      - repomind-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind -d repomind"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: the Next.js dashboard. Not started by `docker compose up` (that only
  # brings up `db`, by name, as the Quickstart in the root README does); run
  # `docker compose --profile frontend up frontend` to also build and start it, or
  # just run `pnpm dev` in frontend/ against a locally-running backend instead.
  frontend:
    build:
      context: ./frontend
    container_name: repomind-frontend
    profiles:
      - frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
    ports:
      - "3000:3000"

volumes:
  repomind-db-data:
