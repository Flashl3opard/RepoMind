services:
  db:
    image: pgvector/pgvector:pg16
    container_name: repomind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
      POSTGRES_DB: repomind
    ports:
      - "5432:5432"
    volumes:
      - repomind-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind -d repomind"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: repomind-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://repomind:repomind@db:5432/repomind
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openai}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      VERIFY_MODEL: ${VERIFY_MODEL:-gpt-4o-mini}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REVIEW_DEBUG_ENABLED: ${REVIEW_DEBUG_ENABLED:-false}
      REVIEW_CONTEXT_MODE: ${REVIEW_CONTEXT_MODE:-full}
      # GITHUB_APP_PRIVATE_KEY: either paste PEM content directly into .env (as one
      # line with literal \n for newlines works with pydantic-settings' env parsing)
      # or leave this as a path and uncomment the volume mount below to mount the
      # actual .pem file instead -- either way, no key is ever baked into the image.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_REVIEW_FORKS: ${GITHUB_REVIEW_FORKS:-false}
      REVIEW_DRY_RUN: ${REVIEW_DRY_RUN:-true}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
      DASHBOARD_AUTH_DISABLED: ${DASHBOARD_AUTH_DISABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    # volumes:
    #   - ${GITHUB_APP_PRIVATE_KEY_FILE:-./github-app-private-key.pem}:/run/secrets/github-app-private-key.pem:ro
    # and set GITHUB_APP_PRIVATE_KEY=/run/secrets/github-app-private-key.pem above instead.
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: repomind-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
    ports:
      - "3000:3000"

volumes:
  repomind-db-data:
