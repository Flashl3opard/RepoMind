[project]
name = "repomind-backend"
version = "0.1.0"
description = "RepoMind ingestion & API backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.2,<3.3",
    "pgvector>=0.3,<0.4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langchain-google-genai>=2.0,<2.1",
    "langchain>=0.3.30",
    "langgraph>=1.0.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<0.8",
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends(...) default-arg idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
